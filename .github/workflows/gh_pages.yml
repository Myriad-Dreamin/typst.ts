name: reflexo::release::gh_pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-gh-pages:
    name: Build and deploy GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # Deploy the documentation site to GitHub Pages.
      id-token: write # Authenticate the Pages deployment with OIDC.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Mold
        run: |
          python3 scripts/ci/install-tool.py mold
          sudo ln -sf "$HOME/.local/bin/mold" "$(realpath /usr/bin/ld)"
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          toolchain: 1.92.0
          target: wasm32-unknown-unknown
      - name: Set Node.js 22.x
        uses: ./.github/actions/setup-node
        with:
          node-version: '22.14.0'
      - name: Install wasm-pack
        run: python3 scripts/ci/install-tool.py wasm-pack
      - name: Download & install shiroa
        run: |
          python3 scripts/ci/install-tool.py shiroa
      - name: Download font assets
        run: python3 scripts/ci/install-tool.py fonts
      - name: Build
        run: |
          cargo build --locked --profile dist --bin typst-ts-cli
      - name: Install packages
        run: |
          yarn install --frozen-lockfile
      - name: Build Typescript packages
        run: |
          yarn run build:pkg
      - name: Prepare artifacts
        run: |
          shiroa build --font-path assets/fonts --path-to-root /typst.ts/cookery/ -w . -d ../../github-pages/cookery/ docs/cookery
      - name: Prepare artifacts (Paged Target)
        run: |
          shiroa build --font-path assets/fonts --path-to-root /typst.ts/cookery/paged/ -w . -d ../../github-pages/cookery/ docs/cookery
          cargo run --locked --profile dist --bin typst-ts-cli -- compile --workspace . --entry ./github-pages/docs/readme.typ --input=x-target=pdf-ayu --format=pdf --format=vector

          mv ./github-pages/cookery/ ./github-pages/dist-paged/
          mkdir -p ./github-pages/cookery/
          mv ./github-pages/dist-paged/ ./github-pages/cookery/paged/
      - name: Prepare artifacts
        run: |
          shiroa build --font-path assets/fonts --path-to-root /typst.ts/cookery/ -w . -d ../../github-pages/cookery/ docs/cookery --mode static-html
      - name: Copy assets
        run: |
          mkdir -p github-pages/compiler/
          mkdir -p github-pages/renderer/
          cp packages/compiler/pkg/* github-pages/compiler/
          cp packages/renderer/pkg/* github-pages/renderer/
          cp packages/typst.ts/dist/esm/main.bundle.js github-pages/typst-main.js
          cp github-pages/cookery/index.html github-pages/index.html
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          # Upload `/github-pages` sub directory
          path: './github-pages'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
