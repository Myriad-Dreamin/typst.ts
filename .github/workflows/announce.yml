name: reflexo::announce
on:
  workflow_call:
    inputs:
      tag:
        description: Release Tag
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release Tag
        required: true
        type: string
permissions:
  'contents': 'write'

env:
  isNightly: ${{ ((!((!contains(inputs.tag, 'rc') && (endsWith(inputs.tag, '0') || endsWith(inputs.tag, '2') || endsWith(inputs.tag, '4') || endsWith(inputs.tag, '6') || endsWith(inputs.tag, '8')))))) }}

jobs:
  build:
    runs-on: 'ubuntu-22.04'
    permissions:
      'contents': 'read'
    outputs:
      release_tag: ${{ steps.announce.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/Myriad-Dreamin/cargo-dist/releases/download/v0.32.0-tinymist.5/cargo-dist-installer.sh | sh"
      - name: Install parse changelog
        uses: taiki-e/install-action@4e79f9caa511ac9527cf5ccb82921377911a6960 # parse-changelog
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
      - name: Install deps
        run: yarn install
      - id: announce
        name: 'Generate announcement'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          yarn draft-release "$RELEASE_TAG"
          echo "draft-release ran successfully"
      - name: 'Upload announcement changelog'
        uses: actions/upload-artifact@v4
        with:
          name: announcement-changelog.md
          path: target/announcement-changelog.md
      - name: 'Upload announcement'
        uses: actions/upload-artifact@v4
        with:
          name: announcement-dist.md
          path: target/announcement-dist.md
      - name: 'Upload announcement'
        uses: actions/upload-artifact@v4
        with:
          name: announcement.gen.md
          path: target/announcement.gen.md
  release:
    needs: build
    runs-on: 'ubuntu-22.04'
    permissions:
      'contents': 'write'
    steps:
      - name: Download announcement
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: announcement.gen.md
          path: target
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ (fromJson(env.isNightly) && '--prerelease') || '' }}"
          RELEASE_TAG: '${{ needs.build.outputs.release_tag }}'
          RELEASE_COMMIT: '${{ github.sha }}'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Creating release for $RELEASE_TAG with PRERELEASE_FLAG=$PRERELEASE_FLAG (isNightly=$isNightly)"
          gh release create "$RELEASE_TAG" $PRERELEASE_FLAG --title "$RELEASE_TAG" --notes-file target/announcement.gen.md --draft=true
