name: reflexo::announce
on:
  workflow_call:
    inputs:
      tag:
        description: Release Tag
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release Tag
        required: true
        type: string
permissions:
  contents: read

concurrency:
  group: announce-${{ inputs.tag }}
  cancel-in-progress: false

env:
  isNightly: ${{ ((!((!contains(inputs.tag, 'rc') && (endsWith(inputs.tag, '0') || endsWith(inputs.tag, '2') || endsWith(inputs.tag, '4') || endsWith(inputs.tag, '6') || endsWith(inputs.tag, '8')))))) }}

jobs:
  build:
    name: Generate and upload release announcement
    runs-on: 'ubuntu-22.04'
    permissions:
      'contents': 'read'
    outputs:
      release_tag: ${{ steps.announce.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        shell: bash
        run: python3 scripts/ci/install-tool.py dist
      - name: Install parse changelog
        run: python3 scripts/ci/install-tool.py parse-changelog
      - name: Install Node.js
        uses: ./.github/actions/setup-node
        with:
          node-version: '22.14.0'
      - name: Install deps
        run: yarn install --frozen-lockfile
      - id: announce
        name: 'Generate announcement'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "Invalid release version" >&2
            exit 1
          fi
          yarn draft-release "$RELEASE_TAG"
          echo "draft-release ran successfully"
      - name: 'Upload announcement changelog'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: announcement-changelog.md
          path: target/announcement-changelog.md
      - name: 'Upload announcement'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: announcement-dist.md
          path: target/announcement-dist.md
      - name: 'Upload announcement'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: announcement.gen.md
          path: target/announcement.gen.md
  release:
    name: Create GitHub release
    needs: build
    runs-on: 'ubuntu-22.04'
    permissions:
      'contents': 'write' # Create a GitHub Release with the generated announcement.
    steps:
      - name: Download announcement
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: announcement.gen.md
          path: target
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ (fromJson(env.isNightly) && '--prerelease') || '' }}"
          RELEASE_TAG: ${{ steps.announce.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Creating release for $RELEASE_TAG with PRERELEASE_FLAG=$PRERELEASE_FLAG (isNightly=$isNightly)"
          gh release create --title "$RELEASE_TAG" --notes-file target/announcement.gen.md --draft=true ${PRERELEASE_FLAG:+--prerelease} -- "$RELEASE_TAG"
