name: reflexo::release_node
on:
  workflow_call:
    inputs:
      tag:
        description: GitHub Release tag used for typst.node assets
        required: true
        type: string
env:
  DEBUG: napi:*
  APP_NAME: typst-ts-node-compiler
  MACOSX_DEPLOYMENT_TARGET: '10.13'
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  YARN_REGISTRY: https://registry.npmjs.org/
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: ./packages/typst.node
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian@sha256:6f910fc8a723a1eeab2483d2302e8c1fabe36e54c51eb0da27fafd5c3083e08c
          - host: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine@sha256:caac2d1b9194eada0c69e669e72763869701351d8957ab805cc45a43999d8be2
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian-aarch64@sha256:54509bac10132e6a4148fd5ef59c0057c37bb332221fb7448d907bd575936114
          - host: ubuntu-24.04
            target: armv7-unknown-linux-gnueabihf
          - host: ubuntu-24.04
            target: aarch64-linux-android
          - host: ubuntu-24.04
            target: armv7-linux-androideabi
          - host: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine@sha256:caac2d1b9194eada0c69e669e72763869701351d8957ab805cc45a43999d8be2
          - host: windows-latest
            target: aarch64-pc-windows-msvc
    name: stable - ${{ matrix.settings.target }} - node@22
    runs-on: ${{ matrix.settings.host }}
    env:
      BUILD_TARGET: ${{ matrix.settings.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Setup node
        uses: ./.github/actions/setup-node
        with:
          node-version: '22.14.0'
      - name: Install Rust
        if: ${{ !matrix.settings.docker }}
        shell: bash
        run: rustup target add "$BUILD_TARGET"
      - uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2
        if: ${{ matrix.settings.target == 'armv7-unknown-linux-gnueabihf' }}
        with:
          version: 0.12.0
      - name: Setup toolchain
        if: ${{ matrix.settings.target == 'armv7-unknown-linux-gnueabihf' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install gcc-arm-linux-gnueabihf=4:13.2.0-7ubuntu1 -y
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build in docker
        if: ${{ matrix.settings.docker }}
        env:
          BUILD_IMAGE: ${{ matrix.settings.docker }}
        run: |
          docker run --rm --user 0:0 --env BUILD_TARGET \
            -v "$GITHUB_WORKSPACE/.cargo-cache/git/db:/usr/local/cargo/git/db" \
            -v "$GITHUB_WORKSPACE/.cargo/registry/cache:/usr/local/cargo/registry/cache" \
            -v "$GITHUB_WORKSPACE/.cargo/registry/index:/usr/local/cargo/registry/index" \
            -v "$GITHUB_WORKSPACE:/build" -w /build/packages/typst.node \
            --entrypoint /bin/sh "$BUILD_IMAGE" -ec '
              case "$BUILD_TARGET" in
                aarch64-unknown-linux-gnu|aarch64-unknown-linux-musl) rustup target add "$BUILD_TARGET" ;;
              esac
              yarn build --target "$BUILD_TARGET"
            '
      - name: Build
        if: ${{ !matrix.settings.docker }}
        shell: bash
        run: |
          args=(--target "$BUILD_TARGET")
          if [[ "$BUILD_TARGET" == armv7-unknown-linux-gnueabihf ]]; then
            args+=(--use-napi-cross)
          fi
          yarn build "${args[@]}"
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            packages/typst.node/${{ env.APP_NAME }}.*.node
            packages/typst.node/index-napi.d.ts
            packages/typst.node/index-napi.js
            packages/typst.node/index.d.ts
            packages/typst.node/index.js
          if-no-files-found: error
