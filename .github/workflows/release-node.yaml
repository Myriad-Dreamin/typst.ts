  test-macOS-windows-binding:
    name: Test bindings on ${{ matrix.settings.target }} - node@${{ matrix.node }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            architecture: x64
          - host: macos-latest
            target: aarch64-apple-darwin
            architecture: arm64
          - host: macos-latest
            target: x86_64-apple-darwin
            architecture: x64
        node:
          - '20.19.0'
          - '22.14.0'
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Setup node
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.settings.architecture }}
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: packages/typst.node
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Test bindings
        run: yarn test
  test-linux-x64-gnu-binding:
    name: Test bindings on Linux-x64-gnu - node@${{ matrix.node }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        node:
          - '20.19.0'
          - '22.14.0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Setup node
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: packages/typst.node
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Test bindings
        env:
          TEST_IMAGE: ${{ matrix.node == '20.19.0' && 'node:20.19.0-slim@sha256:5cfa999422613d3b34f766cbb814d964cbfcb76aaf3607e805da21cccb352bac' || 'node:22.14.0-slim@sha256:1c18d9ab3af4585870b92e4dbc5cac5a0dc77dd13df1a5905cea89fc720eb05b' }}
        run: docker run --rm -v "$GITHUB_WORKSPACE:/build" -w /build/packages/typst.node "$TEST_IMAGE" yarn test
        working-directory: .
  test-linux-x64-musl-binding:
    name: Test bindings on x86_64-unknown-linux-musl - node@${{ matrix.node }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        node:
          - '20.19.0'
          - '22.14.0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Setup node
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: |
          yarn config set supportedArchitectures.libc "musl"
          yarn install --frozen-lockfile
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bindings-x86_64-unknown-linux-musl
          path: packages/typst.node
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Test bindings
        env:
          TEST_IMAGE: node:${{ matrix.node }}-alpine
        run: docker run --rm -v "$GITHUB_WORKSPACE:/build" -w /build/packages/typst.node "$TEST_IMAGE" yarn test
        working-directory: .
  test-linux-aarch64-gnu-binding:
    name: Test bindings on aarch64-unknown-linux-gnu - node@${{ matrix.node }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        node:
          - '20.19.0'
          - '22.14.0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bindings-aarch64-unknown-linux-gnu
          path: packages/typst.node
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Set up locked Node.js tools
        uses: ./.github/actions/setup-node
      - name: Install dependencies
        run: |
          yarn config set supportedArchitectures.cpu "arm64"
          yarn config set supportedArchitectures.libc "glibc"
          yarn install --frozen-lockfile
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          image: tonistiigi/binfmt:latest@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          cache-image: false
          platforms: arm64
      - name: Setup and run tests
        env:
          TEST_IMAGE: ${{ matrix.node == '20.19.0' && 'node:20.19.0-slim@sha256:5cfa999422613d3b34f766cbb814d964cbfcb76aaf3607e805da21cccb352bac' || 'node:22.14.0-slim@sha256:1c18d9ab3af4585870b92e4dbc5cac5a0dc77dd13df1a5905cea89fc720eb05b' }}
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$GITHUB_WORKSPACE:/build" -w /build/packages/typst.node \
            --entrypoint /bin/sh "$TEST_IMAGE" -ec 'yarn test; ls -la'
  # todo: all arm tests are failing
  test-linux-aarch64-musl-binding:
    name: Test bindings on aarch64-unknown-linux-musl - node@lts
    needs:
      - build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
  #     - name: Download artifacts
  #       uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
  #       with:
  #         name: bindings-aarch64-unknown-linux-musl
  #         path: packages/typst.node
  #     - name: List packages
  #       run: ls -R .
  #       shell: bash
  #     - name: Install dependencies
  #       run: |
  #         yarn config set supportedArchitectures.cpu "arm64"
  #         yarn config set supportedArchitectures.libc "musl"
  #         yarn install --frozen-lockfile
  #     - name: Set up QEMU
  #       uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
  #       with:
  #         platforms: arm64
  #     - name: Setup and run tests
  #       uses: addnab/docker-run-action@4f65fabd2431ebc8d299f8e5a018d79a769ae185 # v3
  #       with:
  #         image: node:lts-alpine
  #         options: '--platform linux/arm64 -v ${{ github.workspace }}:/build/ -w /build/packages/typst.node'
  #         run: |
  #           yarn test
  test-linux-arm-gnueabihf-binding:
    name: Test bindings on armv7-unknown-linux-gnueabihf - node@${{ matrix.node }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        node:
          - '20.19.0'
          - '22.14.0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bindings-armv7-unknown-linux-gnueabihf
          path: packages/typst.node
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Set up locked Node.js tools
        uses: ./.github/actions/setup-node
      - name: Install dependencies
        run: |
          yarn config set supportedArchitectures.cpu "arm"
          yarn install --frozen-lockfile
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          image: tonistiigi/binfmt:latest@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          cache-image: false
          platforms: arm
      - name: Setup and run tests
        env:
          TEST_IMAGE: ${{ matrix.node == '20.19.0' && 'node:20.19.0-bullseye-slim@sha256:c9063968e5c359c7430892bd48448f8368aa0a76527b816e03bce59fe08bfd93' || 'node:22.14.0-bullseye-slim@sha256:73a9dfbb6c761aebdf4666cce2627635a30d1d4c20f67ff642d01b8f09e709a3' }}
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v "$GITHUB_WORKSPACE:/build" -w /build/packages/typst.node \
            --entrypoint /bin/sh "$TEST_IMAGE" -ec 'yarn test; ls -la'
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Upload native bindings to the GitHub Release.
      id-token: write # Authenticate to npm via trusted publishing.
    environment:
      name: npm-publish
    needs:
      # - build-freebsd
      - test-macOS-windows-binding
      - test-linux-x64-gnu-binding
      - test-linux-x64-musl-binding
      - test-linux-aarch64-gnu-binding
      - test-linux-aarch64-musl-binding
      - test-linux-arm-gnueabihf-binding
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Setup node
        uses: ./.github/actions/setup-node
        with:
          node-version: 22.14.0
      - name: Upgrade npm and yarn
        run: |
          npm --version
          yarn --version
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: packages/typst.node/artifacts
      - name: Move artifacts
        run: yarn artifacts
      - name: Move transpiled files
        run: |
          cp artifacts/bindings-x86_64-unknown-linux-gnu/index.js index.js
          cp artifacts/bindings-x86_64-unknown-linux-gnu/index.d.ts index.d.ts
          cp artifacts/bindings-x86_64-unknown-linux-gnu/index-napi.js index-napi.js
          cp artifacts/bindings-x86_64-unknown-linux-gnu/index-napi.d.ts index-napi.d.ts
      - name: Prepare package manifests
        run: yarn prepare-publish:napi
      - name: List packages
        run: ls -R ./npm
        shell: bash
      - name: NPM Pack
        run: |
          npm pack > package-name
          mv `cat package-name` myriaddreamin-typst-ts-node-compiler.tar.gz
      - name: Upload packed package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: myriaddreamin-typst-ts-node-compiler
          path: packages/typst.node/myriaddreamin-typst-ts-node-compiler.tar.gz
      - name: Publish
        run: |
          if [[ -z "$RELEASE_TAG" || "$RELEASE_TAG" == -* ]]; then
            echo "Invalid GitHub release tag" >&2
            exit 1
          fi
          node scripts/publish.js "$RELEASE_TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
